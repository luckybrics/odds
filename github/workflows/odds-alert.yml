name: Odds Alert

on:
  workflow_dispatch:          # dipanggil cron-job.org lewat GitHub API
  schedule:
    - cron: "7,37 * * * *"    # cadangan bila cron-job.org gagal (GitHub kadang telat)

# Jangan pernah dua run bersamaan: state (history/pending) ditulis balik ke repo private
concurrency:
  group: odds-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo PRIVATE (kode + data)
        uses: actions/checkout@v4
        with:
          repository: luckybrics/odds-alert-bot      # <- ganti kalau nama repo private berbeda
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: bot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependency
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Jalankan scanner
        working-directory: bot
        env:
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOP_N: "5"
          DIGEST_EVERY_HOURS: "6"
        run: python odds_alert.py

      - name: Simpan state (history / pending) ke repo private
        if: always()
        working-directory: bot
        run: |
          git config user.name  "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
